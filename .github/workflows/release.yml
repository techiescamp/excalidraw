# Turns a tag into installable artifacts. A deploy installs one of these; it
# never copies from a working directory, which is what makes rolling back a
# matter of installing the previous release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Record the version
        id: v
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - run: yarn install --frozen-lockfile

      # Every VITE_APP_* value is compiled into the bundle, so the build needs
      # them. They lived only in a .env.production.local on one machine, which
      # is why the first release built without them: the editor then has no API
      # address, falls back to the plain local Excalidraw, and a workspace
      # drawing never loads. None of these are secret -- they are public in the
      # JavaScript either way.
      - name: Editor configuration
        run: |
          cat > .env.production.local <<'ENV'
          VITE_APP_BACKEND_V2_GET_URL=https://draw.devopsproject.dev/api/v2/
          VITE_APP_BACKEND_V2_POST_URL=https://draw.devopsproject.dev/api/v2/post/
          VITE_APP_WS_SERVER_URL=https://draw.devopsproject.dev
          VITE_APP_API_URL=https://draw.devopsproject.dev/api
          VITE_APP_FIREBASE_CONFIG={}
          VITE_APP_ENABLE_TRACKING=false
          VITE_APP_DISABLE_SENTRY=true
          VITE_APP_FONTS_CDN=/
          ENV

      - name: Build the editor
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build:app

      # A bundle without the API address loads as plain Excalidraw and silently
      # ignores every workspace drawing, which is not visible until someone
      # opens one. Refuse to publish it.
      - name: Check the editor was configured
        run: |
          if ! grep -rq "draw.devopsproject.dev/api" excalidraw-app/build/assets/*.js; then
            echo "::error::the built editor has no API address; it would load as plain Excalidraw"
            exit 1
          fi
          echo "editor is configured for the workspace API"

      - name: Package the editor
        run: tar -czf excalidraw-editor-${{ steps.v.outputs.version }}.tar.gz -C excalidraw-app/build .

      # The API and dashboard ship as source: the server installs its own
      # dependencies, so node_modules must not travel inside the artifact.
      - name: Package the server and dashboard
        run: |
          tar -czf excalidraw-server-${{ steps.v.outputs.version }}.tar.gz \
            --exclude=node_modules --exclude=test \
            server dashboard

      - name: Checksums
        run: sha256sum excalidraw-*.tar.gz > checksums.txt

      - name: Release notes from the commits since the previous tag
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "notes<<EOF"
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              git log --no-merges --format='- %s' "$previous..${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
            fi
            echo
            echo "Install one of these artifacts; do not deploy from a working copy."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.v.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            excalidraw-editor-${{ steps.v.outputs.version }}.tar.gz
            excalidraw-server-${{ steps.v.outputs.version }}.tar.gz
            checksums.txt
